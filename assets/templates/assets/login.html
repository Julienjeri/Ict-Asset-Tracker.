{% extends "base.html" %}

{% block title %}Log in | ICT Asset Tracker{% endblock %}

{% block content %}
    <h1>Staff log in</h1>
    <form class="data-form" method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        {{ form.as_p }}
        <button type="submit">Log in</button>
    </form>
{% endblock %}
